name: Create GitHub Release on Version Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies & Build Production Static Bundle
        run: |
          npm ci
          npm run build
          cd out && zip -r ../fifth-family-tracker-${{ github.ref_name }}-static-build.zip .

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "The Fifth Family Tracker ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          files: fifth-family-tracker-${{ github.ref_name }}-static-build.zip
          draft: false
          prerelease: false
